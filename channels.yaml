# Where each episode is posted.
#
# Hồi Sau is the main channel and gets every episode. Each character is a
# brand of its own with its own Page and accounts, and gets the episodes it
# leads. The dashboard's "Kênh" page lists brands, then their channels.
#
# This file is public: it holds only the NAMES of the .env variables that hold
# each account's ids and tokens, never the values.
#
# status:
#   live     the pipeline posts here
#   paused   set up, but the pipeline skips it
#   planned  the account does not exist yet
#
# TikTok takes videos only; image episodes skip it.
#
# For the contest only Hồi Sau and Lolo's channels are live.

brands:
  - id: hoi-sau
    name: Hồi Sau
    kind: series
    tagline: Mỗi ngày một tập hài văn phòng, tập sau do bình luận viết tiếp
    posts: all
    channels:
      - platform: facebook
        status: live
        env: { pageId: FB_PAGE_ID, token: FB_PAGE_TOKEN }
      - platform: instagram
        status: live
        env: { userId: IG_USER_ID }   # posts with the Facebook Page token above
      - platform: threads
        status: live
        env: { userId: THREADS_USER_ID, token: THREADS_TOKEN, username: THREADS_USERNAME }
      - platform: tiktok
        status: live
        mode: draft   # videos land in the TikTok inbox; the owner adds sound and posts. direct needs TikTok's audit.
        env: { userId: TIKTOK_OPEN_ID, token: TIKTOK_TOKEN, username: TIKTOK_NAME }

  - id: lolo
    name: Lolo
    kind: character
    character: cu-li
    tagline: Người chậm, não nhanh
    posts: lead
    channels:
