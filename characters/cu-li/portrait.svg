  <circle cx="194" cy="240" r="27" fill="#1b1410"/>
  <circle cx="318" cy="240" r="27" fill="#1b1410"/>
  <circle cx="206" cy="226" r="10" fill="#fff"/>
  <circle cx="330" cy="226" r="10" fill="#fff"/>
  <!-- under-eye bags -->
