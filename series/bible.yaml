# Series bible. Every Studio step reads it; `canon` grows as episodes are finished.
title: Hồi Sau
premise: Mỗi ngày một mẩu chuyện hài ở công ty "Công Ty TNHH Hồi Sau", nơi nhân viên là những con vật ít người biết của Việt Nam. Khán giả bình luận để quyết định chuyện gì xảy ra tập sau.
tone: "Hài tình huống, tự giễu đời công sở, hơi lố và hơi dị. Ai cũng có một mặt nổi loạn hoặc dị hợm giấu sau vẻ ngoài ngoan (trường `edge` trong hồ sơ), lộ ra đúng lúc là cú twist. Có một kẻ xấu tính để khán giả bàn cãi (Rico, trưởng nhóm bên cạnh): thảo mai, tranh công, mưu nhỏ, nhưng mưu luôn quay ngược vào chính Rico. Nhân vật trêu nhau, chơi xấu nhau kiểu văn phòng, nhưng không chửi xúc phạm nhau, không doạ, không bắt nạt ai. Cười cùng nhân vật, không cười nhạo."
audience: Người đi làm 22–32 tuổi ở thành phố, quen meme văn phòng.
world:
  company: Công Ty TNHH Hồi Sau, một công ty truyền thông nhỏ ở tầng 7 một toà văn phòng cũ
  places:
    - Phòng làm việc mở, có cây trầu bà sắp chết
    - Phòng họp "Sáng Tạo" duy nhất, máy chiếu chập chờn
    - Pantry có máy pha cà phê hay hỏng
    - Thang máy chậm
  recurring_extras:
    - Sếp (một con cú mèo đeo kính, trưởng phòng, không bao giờ nêu tên)
    - Con mèo trắng Tuyết của Giám đốc, con vật duy nhất ở công ty không phải đi làm
    - Chị kế toán trưởng (một con rùa, luôn đúng)
    - Đồng nghiệp do khán giả đề xuất (vẽ theo mô tả bằng chữ)
rules:
  - Mỗi tập đứng riêng được; người mới xem vẫn hiểu
  - Mỗi tập xoay quanh một khoảnh khắc "trigger" mà người đi làm thấy chính mình trong đó (tin nhắn "em ơi" lúc 22h, họp không agenda, file gửi lúc 16h59)
  - Truyện chạy bằng tình huống và hình; punchline phải đọc được từ tranh, không cần chữ
  - Hạn chế gọi tên nhân vật trong thoại; người xem nhận ra họ bằng dáng và tính cách
  - Thoại là tiếng Bắc (Hà Nội) nói hằng ngày, câu cụt, đanh, có miếng; câu chốt đặt cuối và đọc lên là bật cười; không giảng giải, không nói ra bài học hay ý nghĩa của tranh (sai - "Còn bị giảng là còn được nghỉ"; đúng - "Sếp ơi, xong nó thì đến lượt em nhé!")
  - Giọng Threads - thoại và caption viết như dân Threads gõ - chữ thường, t/m/ko/đc, câu lửng, "=)))", tự giễu, kể lể từng dòng rồi chốt phũ. Chửi thề (đ*m, v*l...) là thô tục, không lạm dụng - mặc định không dùng; chỉ khi nó chính là cú chốt và không câu nào thay được, hiếm lắm mới một lần, luôn che bằng dấu *; không chửi thẳng vào ai, không từ tục về bộ phận cơ thể hay tình dục. Giọng Threads đến từ nhịp câu và cách gõ, không đến từ chửi
  - Lóng trend (Threads/TikTok, kenh14 5/2026) tối đa 1 cụm mỗi tập, chỉ khi khớp đúng tình huống, đặt ở câu chốt hoặc caption, không giải thích - "Ủa? Từ từ…" (khựng lại vì đọc thấy điều bất ngờ); "Cổ điển. Tôn trọng." (khen kiểu mỉa cái cũ mà vẫn làm tới nơi, vd sếp lại giao việc lúc 16h59 thứ Sáu); "Rút wifi vẫn còn 5G" (trốn không thoát, vd nghỉ phép vẫn bị nhắn việc); "Hài hước tưởng mình vô duyên" (khen ngược, chỉ dùng khi kênh trả lời bình luận); "chan" / "chan đê" (thách đấu kiểu đùa, cổ vũ lao vào, vd hai người tranh phòng họp - "chan đê", hoặc né việc - "thôi chan người khác đi, t xin")
  - Ít chữ - tối đa 12 chữ mỗi bong bóng, tối đa 2 bong bóng mỗi khung, mỗi tập ít nhất 1 khung không thoại
  - Khung cuối luôn có một móc nhỏ cho "hồi sau"
  - Mặt dị (`edge`) của nhân vật là vũ khí twist: dùng khi cần cú lật, đừng phí mỗi tập; khi lộ ra thì vẽ thật lố
  - Tập có Rico kết bằng câu hỏi để khán giả phân xử (Rico sai hay khôn?); mưu của Rico không bao giờ thắng hẳn
  - Không có chữ vẽ trong tranh; mọi chữ là lớp ghép riêng
  - Nhân vật được trêu nhau và có tật xấu, nhưng không xúc phạm ai; không nhắc người thật, công ty thật, nhãn hàng thật, chính trị, tôn giáo
  - Không đùa chuyện săn bắt, buôn bán động vật hoang dã
  - Đồng nghiệp do khán giả gợi ý chỉ vẽ theo mô tả bằng chữ, không theo ảnh thật
