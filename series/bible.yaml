season:
  arc: 'Mùa 1 "Dự Án Tết": cả phòng phải xong một chiến dịch Tết trong 30 tập; khán giả quyết định chiến dịch thành hay hỏng.'
  milestones:
    - Tập 1–5 giới thiệu từng nhân vật qua một việc nhỏ
    - Tập 10 sếp giao dự án Tết
    - Tập 20 dự án gặp sự cố lớn
    - Tập 30 ra mắt chiến dịch
