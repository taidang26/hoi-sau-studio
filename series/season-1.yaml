finale: >-
  Chiến dịch Tết ra mắt. Theo bình chọn của khán giả, nó thành công rực rỡ hoặc
  hỏng một cách đáng yêu; dù kiểu nào, cả phòng nhận ra mỗi cái tật đã cứu dự án
  một lần, và Uni gửi email cảm ơn cả phòng lúc 3 giờ sáng.
