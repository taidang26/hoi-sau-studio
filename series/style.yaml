# Series art style: one look for every character and every panel.
# `base` and the chosen variant go into every Muse Image prompt (English).
# Pick a variant with `studio style` (draws the test scene in each variant),
# then `studio style approve <id>`: that render becomes series/style-ref.* and is
# attached as a reference image to every model sheet and episode.
chosen: null
reference: null
base: >-
  Cute chibi comic style: big round heads about a third of the body, short
  round limbs, soft chubby shapes. Clean, even, thick black outlines. Soft
  airbrushed shading on the round forms: gently darker towards the edges, a
  soft highlight on top, a blended warm blush on the cheeks.
  Simple round eyes with one white highlight, eyebrows that do the acting.
  Exaggerated cartoon acting, pushed further than feels safe: squash and
  stretch, extreme faces (jaw on the floor, eyes popping, tears streaming,
  fur standing on end), bold dynamic poses with strong diagonal lines of
  action, bodies bending and stretching like rubber. Drawn comic effects add
  energy: sweat drops, speed and motion lines, shock lines, anger veins, steam
  puffs, sparkles, little stars, dust clouds, always as pictures, never as
  letters. Big, readable poses and expressions that land at phone size. Each panel sits on
  one muted background tone that contrasts with the characters and fits the
  mood (sage or deep green, warm beige, dusty blue, night navy), with only one
  or two props that tell the story; the far background is simpler and softer
  than the characters. Light comes from sources in the scene: window
  daylight, a monitor glowing on a face, a desk lamp, a phone screen.
  Lighting stays cheerful: daytime by default. When the story needs evening or night (overtime,
  a party), keep it warm and lively, lit by lamps and screens, never gloomy.
avoid:
  - photorealism, 3D render, glossy plastic shine, painterly fur texture, thin sketchy lines
  - busy backgrounds full of coworkers and objects, backgrounds as bright and detailed as the characters
  - anime sparkle eyes, manga screentone
  - drawn text, letters, numbers on signs, speech bubbles, captions, logos
  - gloomy, murky or depressing lighting, heavy shadows, a mood of despair
  - stiff, static, symmetrical poses; calm neutral faces when the beat has emotion
variants:
  - id: warm-pastel
    label: Pastel ấm, nền một màu
    prompt: Warm pastel palette (cream, peach, butter yellow, sage, dusty blue). Each panel background is one soft flat colour with only the props that matter.
  - id: hanoi-detail
    label: Nền phố/văn phòng Hà Nội chi tiết
    prompt: Characters stay bold and flat, while backgrounds show real Hanoi office and street details (tangled power lines, motorbikes, plastic stools, old tiled floors) drawn with thinner, lighter lines and muted colours so the characters pop.
  - id: sticker-bold
    label: Kiểu sticker, nét rất đậm
    prompt: Bold sticker look. Extra thick outlines, saturated flat colours, plain one-colour backgrounds, characters filling most of the panel.
  - id: soft-pencil
    label: Giấy mềm, nét chì màu
    prompt: Soft paper texture, slightly wobbly hand-drawn outlines, muted colours like coloured pencil on cream paper.
# The scene every variant draws, so the four renders compare like for like.
test_scene: >-
  Two small animal office workers at a cluttered desk at 4:59 p.m. A chubby
  slow loris in an oversized mustard-yellow hoodie is slumped over the keyboard
  with huge tired amber eyes; a pangolin in a light-blue short-sleeve shirt
  stands behind with a thick folder, smiling politely. A wall clock, a coffee
  mug, a stack of papers.
