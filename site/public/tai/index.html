<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Tải clip Hồi Sau</title>
<style>:root{--bg:#fbf8f1;--fg:#222;--card:#fff;--line:#e6e0d2;--acc:#e0a526}@media (prefers-color-scheme:dark){:root{--bg:#1c1b19;--fg:#eee;--card:#262522;--line:#3a3833}}
body{background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,sans-serif;margin:0;padding:16px;max-width:560px;margin:auto}h1{font-size:22px}h2{font-size:18px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}video{width:100%;max-height:60vh;border-radius:8px;background:#000}
.btn{display:block;text-align:center;background:var(--acc);color:#222;font-weight:600;border:0;border-radius:10px;padding:12px;margin:10px 0;text-decoration:none;font-size:17px;width:100%;box-sizing:border-box}.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
textarea{width:100%;box-sizing:border-box;font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--fg)}label{font-size:14px;opacity:.7}small{opacity:.7}</style></head><body>
<h1>Tải clip Hồi Sau</h1><small>Bấm "Tải video": iPhone sẽ hỏi "Tải về", file nằm trong ứng dụng Tệp → Tải về, mở ra rồi bấm Chia sẻ → Lưu video. Android tự lưu vào Tải xuống.</small>
<section class="card"><h2>Clip 3: Thứ Hai đến thứ Sáu</h2>
<video src="/media/dl/hoisau-clip-3.mp4" controls playsinline preload="metadata"></video>
<a class="btn" href="/media/dl/hoisau-clip-3.mp4" download="hoisau-clip-3.mp4">Tải video</a>
<label>Caption TikTok</label><textarea readonly rows="3">Mệt nhất tuần là… từ thứ Hai đến thứ Năm 😮‍💨 #HoiSau #danvanphong #thuhai #cuoituan</textarea>
<button class="btn ghost" onclick="cp(this)">Copy caption</button></section><section class="card"><h2>Clip 4: Đạt KPI thì tăng KPI</h2>
<video src="/media/dl/hoisau-clip-4.mp4" controls playsinline preload="metadata"></video>
<a class="btn" href="/media/dl/hoisau-clip-4.mp4" download="hoisau-clip-4.mp4">Tải video</a>
<label>Caption TikTok</label><textarea readonly rows="3">Đạt KPI thì được… tăng KPI 🙃 #danvanphong #HoiSau #congso #KPI
cre: Chim nhỏ nhỏ</textarea>
<button class="btn ghost" onclick="cp(this)">Copy caption</button></section><section class="card"><h2>Clip 5: Rico giả vờ hết tiền</h2>
<video src="/media/dl/hoisau-clip-5.mp4" controls playsinline preload="metadata"></video>
<a class="btn" href="/media/dl/hoisau-clip-5.mp4" download="hoisau-clip-5.mp4">Tải video</a>
<label>Caption TikTok</label><textarea readonly rows="3">Giả vờ hết tiền để thử lòng người… ai ngờ hết thật 🥲 #danvanphong #HoiSau #congso #cuoithang
cre: Satank</textarea>
<button class="btn ghost" onclick="cp(this)">Copy caption</button></section>
<script>function cp(b){const t=b.previousElementSibling;t.select();navigator.clipboard?navigator.clipboard.writeText(t.value).then(()=>{b.textContent="Đã copy ✓"}):(document.execCommand("copy"),b.textContent="Đã copy ✓")}</script></body></html>
